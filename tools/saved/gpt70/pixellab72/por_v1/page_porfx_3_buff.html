<!doctype html><meta charset=utf-8><title>짐꾼 버프 효과 시안</title><style>body{margin:0;background:#1c1f26;color:#e8e6e0;font-family:system-ui,sans-serif}main{max-width:1240px;margin:0 auto;padding:16px}h3{margin:18px 0 6px;color:#f0c878}p{opacity:.88;margin:4px 0}img{image-rendering:pixelated;border-radius:6px;width:600px}</style><main><h2>짐꾼 1차 버프 효과 — 시안</h2><p>버프는 「몸을 감싸는 빛 + 머리 위 아이콘」 규칙대로(전사 돌격 함성 v5와 같은 길). 짐꾼은 늘 맨 뒤라 동료(전사)가 앞(오른쪽)에 섭니다. 아이콘은 게임 스킬 그림(16×20)을 2배로.</p><h3>짐 덜어 주기 — 파티 재사용 단축</h3><p>연둣빛: 동료의 짐을 받아 드는 동작에 → 몸이 연둣빛으로 감싸이고 깃털 조각이 흩날림(가벼워짐) → 동료도 → 머리 위 아이콘</p><img src='data:image/gif;base64,R0lGODlhLAHIAIcAAP/////31tzlu+Li5f7cud7f5P/ha//TjvrAkP29JuzWuOa8lNzHrcLDxd2/RK3WP/61bf+sZdGrfMqyp7i3u622haioqIOrR/2lAvySYcmje7CRRKiPhqGdmpmSkZSQcZGfc36NZuCHUOF/O6GHV5V9ZYKDiXSEYHKLdWl9YmKAPP97a/94B8tnN7NkN6V7XodwR318T3tpZHhjPnVyV2pxdHRxP21pYW9tSWVlQndiQ2VhO19yW1VnVFJmM/9UP+tKSqFaKoZaO20/JGtZPWlVN2RRN2BOM2JJIk1dTF9YUVtZPVhVT1FQOE9NM1JINlNELlZBKUNUR0RTLEdIJEZHLUZGQDZGPERBNDRBKc42Nr8vPJ42O50rK3szBZUfH2YZJUs9KlA5Ikk7K0U0G0YjEkI9IkIxIUIRDEA9P0A2Jjo7Jzo5OTwtJDE9MzYuIjkoGTMqDzIlHDUhFTgFAio2NDAzIisuIy4nHi0dEygzKiQuMxsmJSEdGScdCBobGSUZFyUXDRgYFREaGh0UBAwUFhwTEB8RBhcNCAwKAg4HBAgGBgkFAQYDBQ8CAAYBAQICBQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACH/C05FVFNDQVBFMi4wAwEAAAAh+QQACAAAACwAAAAALAHIAAAI/wAHCRTIZ1DBgQYPIuRzsE4fNW/21JlIkWKfN2qgTNzDsaNHPhz7iOyDB89Fk29ShlHDUo1JPCyhQFGTZc2UOnzWrGmyo2IdNz7duGFItChRjkXv3DkqcY9Qj26uXEkSNYlVN1KyapXC0E2SOkmyWu3RI8WJs2jTqkUboi2It28rgKhAl+7cunLrwgXRtu+JFIADC07Bo7DhwmVTaJXKWGrWK4sZP25s9YrQy5gz82lyBecgy5evLDSIkHTphAUlklTTx2dFkRn51PFI2+NIkihLpmzJUiRMNWGOQHmT

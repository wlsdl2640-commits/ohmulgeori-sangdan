<div id="app">
  <header class="hud" id="hud">
    <span class="hv gold"><img class="pi" data-px="coin" alt="골드"><b id="h-gold">0</b></span>
    <span class="hv fame"><img class="pi" data-px="star" alt="명성"><b id="h-fame">0</b></span>
    <span class="hv date" id="h-date"></span>
    <span class="hv rent" id="h-rent"></span>
    <button type="button" class="spd" id="speed" aria-label="게임 속도">1×</button>
  </header>

  <section class="stage" id="stage" aria-label="상단 본부">
    <canvas id="hq" aria-label="상단 본부 장소 화면. 옆으로 밀면 다른 장소로 넘어가고, 가구나 사람을 누르면 그 창이 열려요."></canvas>
    <nav class="placebar" id="placebar" aria-label="장소 이동"></nav>
    <nav class="menu" id="menu" aria-label="메뉴">
      <button type="button" class="mbtn mmain" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-board"><img data-px="menu" alt="">메뉴<span class="badge" id="menu-badge" hidden></span></button>
      <div class="mboard" id="menu-board" hidden>
        <h2 class="mb-title">메뉴판</h2>
        <div class="mb-grid">
          <button type="button" class="mtile" data-open="co"><img data-px="m_house" alt=""><b>상단</b><small>랭크 · 정산</small></button>
          <button type="button" class="mtile" data-open="fac"><img data-px="m_anvil" alt=""><b>시설</b><small>짓기 · 대장간</small></button>
          <button type="button" class="mtile" data-open="adv"><img data-px="m_person" alt=""><b>모험가</b><small>전직 · 스킬</small></button>
          <button type="button" class="mtile" data-open="map"><img data-px="m_map" alt=""><b>지도</b><small>필드 · 왕국</small></button>
          <button type="button" class="mtile" data-open="exp"><img data-px="m_sword" alt=""><b>원정대</b><small>파티 · 출발</small></button>
          <button type="button" class="mtile" data-open="inv"><img data-px="m_box" alt=""><b>창고</b><small>창고 1~10</small></button>
          <button type="button" class="mtile" data-open="req"><img data-px="m_scroll" alt=""><b>의뢰</b><small>의뢰 게시판</small><span class="badge" id="req-badge" hidden></span></button>
        </div>
        <div class="mb-sub" aria-label="상단 창 바로 가기"><button type="button" class="mchip" data-sub="co_money"><img data-px="c_money" alt="">월말 정산</button><button type="button" class="mchip" data-sub="dex"><img data-px="c_dex" alt="">도감</button><button type="button" class="mchip" data-sub="achv"><img data-px="c_achv" alt="">업적</button><button type="button" class="mchip" data-sub="co_log"><img data-px="c_log" alt="">소식</button><button type="button" class="mchip" data-sub="co_set"><img data-px="c_set" alt="">설정</button></div>
      </div>
    </nav>
    <section class="pip" id="pip" aria-label="원정 화면. 누르면 전투 창이 열려요." role="button" tabindex="0">
      <canvas id="cv" width="480" height="256"></canvas>
      <div class="callouts" id="callouts" aria-hidden="true"></div>
      <div class="ov ov-l" id="ov-l"></div>
      <div class="ov ov-r" id="ov-r" hidden></div>
      <div class="ov ov-b" id="ov-b" hidden></div>
      <span class="pip-sz" aria-hidden="true"></span>
    </section>
    <section class="bwin" id="bwin" hidden aria-label="전투 창">
      <header class="win-h">
        <button type="button" class="win-btn" id="bw-back" aria-label="뒤로"><span class="arr"></span>뒤로</button>
        <h2 id="bw-title"></h2>
        <button type="button" class="win-btn" id="bw-x" aria-label="닫기">닫기</button>
      </header>
      <div class="bw-body">
        <div class="bw-frame">
          <canvas id="bcv" width="480" height="400" aria-label="전투 장면"></canvas>
          <div class="callouts" id="bcallouts" aria-hidden="true"></div>
          <div class="ov ov-r" id="bw-load" hidden></div>
        </div>
        <div class="bw-stat"><span class="bw-st" id="bw-st"></span><span class="bw-prog" aria-hidden="true"><i id="bw-prog"></i></span></div>
        <div class="bw-log" id="bw-log" role="log" aria-label="전투 기록"></div>
        <div class="bw-btns">
          <span id="bw-gate" hidden><button type="button" class="btn sm gold" data-act="gate" data-c="enter">던전 들어가기</button><button type="button" class="btn sm" data-act="gate" data-c="skip">지나가기</button></span>
          <button type="button" class="btn sm" id="bw-stats">통계</button>
          <button type="button" class="btn sm" id="bw-ret" data-act="recall">복귀 명령</button>
          <button type="button" class="btn sm" id="bw-close">닫기</button>
        </div>
      </div>
    </section>
  </section>

  <div class="upd" id="upd" role="status" hidden></div>

  <div class="chipbar" id="chipbar">
    <nav class="pchips" id="pchips" aria-label="파티 화면 고르기"></nav>
  </div>

  <section class="win" id="win" hidden>
    <header class="win-h">
      <button type="button" class="win-btn" id="win-back" aria-label="뒤로"><span class="arr"></span>뒤로</button>
      <h2 id="win-title"></h2>
      <button type="button" class="win-btn" id="win-x" aria-label="닫기">닫기</button>
    </header>
    <nav class="win-path" id="win-path" aria-label="지금 위치"></nav>
    <main class="panel" id="panel"><div class="panel-in" id="panel-in"></div></main>
  </section>

  <div class="title-scr" id="title-scr" hidden>
    <canvas id="title-cv" width="240" height="128"></canvas>
    <div class="title-in">
      <div>
        <p class="game-sub" id="t-sub"></p>
        <h1 class="game-name">판타지<br>상단키우기</h1>
      </div>
      <div class="intro" id="t-intro"></div>
      <form class="field-in" id="t-form">
        <label for="t-name">상단 이름</label>
        <input id="t-name" maxlength="12" autocomplete="off" placeholder="등불 상단">
        <button type="submit" class="btn gold block" id="t-go">상단 문 열기</button>
      </form>
      <button type="button" class="btn sm" id="t-import">저장 코드로 이어하기</button>
      <p class="credit">글꼴: 갈무리 (SIL Open Font License 1.1)</p>
    </div>
  </div>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal" id="m-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 id="m-title"></h2>
      <div id="m-body"></div>
      <div class="m-btns" id="m-btns"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<div id="app">
  <header class="hud" id="hud">
    <span class="hv gold"><img class="pi" data-px="coin" alt="골드"><b id="h-gold">0</b></span>
    <span class="hv fame"><img class="pi" data-px="star" alt="명성"><b id="h-fame">0</b></span>
    <span class="hv date" id="h-date"></span>
    <span class="hv rent" id="h-rent"></span>
    <button type="button" class="spd" id="speed" aria-label="게임 속도">1×</button>
  </header>

  <section class="stage" id="stage" aria-label="길드 본부">
    <canvas id="hq" aria-label="길드 본부 장소 화면. 옆으로 밀면 다른 장소로 넘어가고, 가구나 사람을 누르면 그 창이 열려요."></canvas>
    <nav class="placebar" id="placebar" aria-label="장소 이동"></nav>
    <nav class="menu" id="menu" aria-label="메뉴">
      <button type="button" class="mbtn mmain" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-board"><img data-px="menu" alt="">메뉴<span class="badge" id="menu-badge" hidden></span></button>
      <div class="mboard" id="menu-board" hidden>
        <h2 class="mb-title">메뉴판</h2>
        <div class="mb-grid">
          <button type="button" class="mtile" data-open="co"><img data-px="m_house" alt=""><b>길드</b><small>랭크 · 정산</small></button>
          <button type="button" class="mtile" data-open="fac"><img data-px="m_anvil" alt=""><b>시설</b><small>짓기 · 대장간</small></button>
          <button type="button" class="mtile" data-open="adv"><img data-px="m_person" alt=""><b>길드원</b><small>전직 · 스킬</small></button>
          <button type="button" class="mtile" data-open="map"><img data-px="m_map" alt=""><b>지도</b><small>필드 · 왕국</small></button>
          <button type="button" class="mtile" data-open="exp"><img data-px="m_sword" alt=""><b>원정대</b><small>파티 · 출발</small></button>
          <button type="button" class="mtile" data-open="inv"><img data-px="m_box" alt=""><b>창고</b><small>창고 1~10</small></button>
          <button type="button" class="mtile" data-open="req"><img data-px="m_scroll" alt=""><b>의뢰</b><small>의뢰 게시판</small><span class="badge" id="req-badge" hidden></span></button>
        </div>
        <div class="mb-sub" aria-label="길드 창 바로 가기"><button type="button" class="mchip" data-sub="co_money"><img data-px="c_money" alt="">월말 정산</button><button type="button" class="mchip" data-sub="dex"><img data-px="c_dex" alt="">도감</button><button type="button" class="mchip" data-sub="achv"><img data-px="c_achv" alt="">업적</button><button type="button" class="mchip" data-sub="co_log"><img data-px="c_log" alt="">소식</button><button type="button" class="mchip" data-sub="co_set"><img data-px="c_set" alt="">설정</button></div>
      </div>
    </nav>
    <section class="pip" id="pip" aria-label="원정 화면. 누르면 전투 창이 열려요." role="button" tabindex="0">
      <canvas id="cv" width="480" height="256"></canvas>
      <div class="rhead" id="rhead" aria-hidden="true"><span class="rh-t" id="rh-t"></span><span class="rh-bar"><i id="rh-hp"></i></span><b class="rh-p" id="rh-p"></b></div>
      <canvas id="rcv" width="480" height="200" aria-label="레이드 원정대 창. 칸을 누르면 그 파티의 전투 창이 열려요."></canvas>
      <div class="rtags" id="rtags" aria-hidden="true"></div>
      <div class="pip-dots" id="pip-dots" hidden><button type="button" class="pdot" data-pg="0" aria-label="원정대 창"></button><button type="button" class="pdot" data-pg="1" aria-label="레이드 원정대 창"></button></div>
      <div class="callouts" id="callouts" aria-hidden="true"></div>
      <div class="ov ov-l" id="ov-l"></div>
      <div class="ov ov-r" id="ov-r" hidden></div>
      <div class="ov ov-b" id="ov-b" hidden></div>
      <span class="pip-sz" aria-hidden="true"></span>
    </section>
    <section class="bwin" id="bwin" hidden aria-label="전투 창">
      <header class="win-h">
        <button type="button" class="win-btn" id="bw-back" aria-label="뒤로"><span class="arr"></span>뒤로</button>
        <h2 id="bw-title"></h2>
        <button type="button" class="win-btn" id="bw-x" aria-label="닫기">닫기</button>
      </header>
      <div class="bw-body">
        <div class="bw-frame">
          <canvas id="bcv" width="480" height="200" aria-label="전투 장면"></canvas>
          <div class="callouts" id="bcallouts" aria-hidden="true"></div>
          <div class="ov ov-r" id="bw-load" hidden></div>
        </div>
        <div class="bw-stat"><span class="bw-st" id="bw-st"></span><span class="bw-prog" aria-hidden="true"><i id="bw-prog"></i></span></div>
        <div class="bw-log" id="bw-log" role="log" aria-label="전투 기록"></div>
        <div class="bw-btns">
          <span id="bw-gate" hidden><button type="button" class="btn sm gold" data-act="gate" data-c="enter">던전 들어가기</button><button type="button" class="btn sm" data-act="gate" data-c="skip">지나가기</button></span>
          <button type="button" class="btn sm" id="bw-stats">통계</button>
          <button type="button" class="btn sm" id="bw-ret" data-act="recall">복귀 명령</button>
          <button type="button" class="btn sm" id="bw-close">닫기</button>
        </div>
      </div>
    </section>
  </section>

  <div class="upd" id="upd" role="status" hidden></div>

  <div class="chipbar" id="chipbar">
    <nav class="pchips" id="pchips" aria-label="파티 화면 고르기"></nav>
  </div>

  <section class="win" id="win" hidden>
    <header class="win-h">
      <button type="button" class="win-btn" id="win-back" aria-label="뒤로"><span class="arr"></span>뒤로</button>
      <h2 id="win-title"></h2>
      <button type="button" class="win-btn" id="win-x" aria-label="닫기">닫기</button>
    </header>
    <nav class="win-path" id="win-path" aria-label="지금 위치"></nav>
    <main class="panel" id="panel"><div class="panel-in" id="panel-in"></div></main>
  </section>

  <div class="title-scr" id="title-scr" hidden>
    <img class="t-bg" id="t-bg" alt="">
    <div class="t-main" id="t-main">
      <div class="t-logo"><p class="game-sub">미궁도시</p><h1 class="game-name">라비린토스</h1></div>
      <nav class="t-menu" aria-label="첫 화면 메뉴">
        <button type="button" class="tbtn main" id="t-start">게임시작</button>
        <button type="button" class="tbtn" id="t-sys">시스템설정</button>
        <button type="button" class="tbtn" id="t-langb">언어설정</button>
      </nav>
      <p class="credit">글꼴: 갈무리 (SIL Open Font License 1.1)</p>
    </div>
    <div class="t-sheet" id="t-found" hidden>
      <form class="parch" id="t-form">
        <p class="parch-to">라비린토스 모험가 협회 귀중</p>
        <h2 class="parch-h">길드 창립 신청서</h2>
        <label class="parch-row" for="t-name"><span>길드 이름</span><input id="t-name" maxlength="12" autocomplete="off" placeholder="여기에 적는다"></label>
        <p class="parch-err" id="t-err" role="alert" hidden>길드 이름을 적어 주세요.</p>
        <p class="parch-p">위 길드는 모험가 협회의 규약을 따르고, 라비린토스의 지하미궁을 탐사하며, 미궁에서 얻은 부산물을 협회가 정한 절차대로 거래할 것을 서약합니다.</p>
        <div class="parch-foot"><div class="parch-sign"><span>신청인</span><b>길드 마스터</b></div><div class="parch-seal" aria-hidden="true"><i>접수</i></div></div>
        <div class="parch-btns"><button type="button" class="tbtn sm" id="t-back">돌아가기</button><button type="submit" class="tbtn sm main" id="t-go">게임시작</button></div>
      </form>
    </div>
    <div class="t-sheet" id="t-opt" hidden>
      <div class="t-box" role="dialog" aria-labelledby="t-opt-h">
        <h2 id="t-opt-h">시스템설정</h2>
        <div class="t-row"><span>효과음</span><button type="button" class="tbtn sm" id="t-sfx"></button></div>
        <div class="t-row"><span>배경음</span><button type="button" class="tbtn sm" id="t-bgm"></button></div>
        <div class="t-row"><span>음량</span><div class="t-vol"><button type="button" class="tbtn sm" id="t-vdn" aria-label="음량 줄이기">−</button><b id="t-vol"></b><button type="button" class="tbtn sm" id="t-vup" aria-label="음량 키우기">＋</button></div></div>
        <div class="t-row"><span>이어하기</span><button type="button" class="tbtn sm" id="t-import">저장 코드로 이어하기</button></div>
        <button type="button" class="tbtn sm main t-close" data-tclose>닫기</button>
      </div>
    </div>
    <div class="t-sheet" id="t-lang" hidden>
      <div class="t-box" role="dialog" aria-labelledby="t-lang-h">
        <h2 id="t-lang-h">언어설정</h2>
        <div class="t-langs"><button type="button" class="tbtn sm on" aria-pressed="true">한국어</button><button type="button" class="tbtn sm" disabled>English · 준비 중</button><button type="button" class="tbtn sm" disabled>日本語 · 準備中</button></div>
        <button type="button" class="tbtn sm main t-close" data-tclose>닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal" id="m-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 id="m-title"></h2>
      <div id="m-body"></div>
      <div class="m-btns" id="m-btns"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
